#
# Build and deploy the documentation
#
name: Build and Deploy

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    # Run weekly at 00:00 on Sunday
    - cron: '0 0 * * 0'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_URL: /seismology101
    permissions:
      contents: write
    defaults:
      run:
        shell: bash -l {0}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Micromamba
        uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39  # v3.2.1
        with:
          environment-file: environment.yml
          cache-downloads: false
          cache-environment: true

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        if: github.event_name != 'schedule'
        with:
          path: |
            source/_build/cache/
            source/_build/execute/
            source/_build/templates/
            ~/.local/share/cartopy/
            ~/.matplotlib/
          key: ${{ runner.os }}-${{ hashFiles('environment.yml', 'source/myst.yml', 'source/**/*.md', 'source/**/*.bib') }}
          restore-keys: ${{ runner.os }}-

      - name: Build documentation
        run: make html

      - name: Deploy documentation
        if: github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453  # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./source/_build/html
          # Only keep the latest commit to avoid bloating the repository
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
